<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" style="background: transparent;">
  <defs>
    <style>
      @keyframes climb {
        0% {
          transform: translateY(400px);
        }
        25% {
          transform: translateY(300px);
        }
        50% {
          transform: translateY(200px);
        }
        75% {
          transform: translateY(100px);
        }
        100% {
          transform: translateY(0px);
        }
      }
      
      .climber {
        animation: climb 8s infinite ease-in-out;
      }
      
      @keyframes armWave {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(45deg); }
      }
      
      .arm-right {
        animation: armWave 1.5s infinite ease-in-out;
        transform-origin: 50% 50%;
      }
      
      .arm-left {
        animation: armWave 1.5s infinite ease-in-out;
        animation-delay: 0.75s;
        transform-origin: 50% 50%;
      }
    </style>
  </defs>

  <!-- Fondo degradado oscuro -->
  <rect width="1200" height="600" fill="rgba(20,40,60,0.3)"/>

  <!-- Escaleras grandes y visibles -->
  <g stroke="rgba(255,255,255,0.8)" stroke-width="6" fill="none" stroke-linecap="round">
    <!-- Escalera 1 -->
    <line x1="200" y1="500" x2="320" y2="500"/>
    <line x1="320" y1="500" x2="320" y2="380"/>
    
    <!-- Escalera 2 -->
    <line x1="320" y1="380" x2="440" y2="380"/>
    <line x1="440" y1="380" x2="440" y2="260"/>
    
    <!-- Escalera 3 -->
    <line x1="440" y1="260" x2="560" y2="260"/>
    <line x1="560" y1="260" x2="560" y2="140"/>
    
    <!-- Escalera 4 -->
    <line x1="560" y1="140" x2="680" y2="140"/>
    <line x1="680" y1="140" x2="680" y2="20"/>
  </g>

  <!-- Personaje animado subiendo (grande y visible) -->
  <g class="climber">
    <!-- Cuerpo (rectángulo) -->
    <rect x="550" y="50" width="40" height="60" rx="5" fill="rgba(255, 160, 0, 0.95)"/>
    
    <!-- Cabeza (círculo) -->
    <circle cx="570" cy="35" r="18" fill="rgba(255, 160, 0, 0.95)"/>
    
    <!-- Ojos -->
    <circle cx="562" cy="32" r="3" fill="rgba(0,0,0,0.9)"/>
    <circle cx="578" cy="32" r="3" fill="rgba(0,0,0,0.9)"/>
    
    <!-- Sonrisa -->
    <path d="M 562 40 Q 570 43 578 40" stroke="rgba(0,0,0,0.9)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Brazo derecho levantado -->
    <g class="arm-right">
      <line x1="590" y1="65" x2="620" y2="35" stroke="rgba(255, 160, 0, 0.95)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="625" cy="30" r="8" fill="rgba(255, 200, 100, 0.95)"/>
    </g>
    
    <!-- Brazo izquierdo levantado -->
    <g class="arm-left">
      <line x1="550" y1="65" x2="520" y2="35" stroke="rgba(255, 160, 0, 0.95)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="515" cy="30" r="8" fill="rgba(255, 200, 100, 0.95)"/>
    </g>
    
    <!-- Pierna derecha -->
    <line x1="575" y1="110" x2="580" y2="135" stroke="rgba(255, 160, 0, 0.95)" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Pierna izquierda -->
    <line x1="565" y1="110" x2="560" y2="135" stroke="rgba(255, 160, 0, 0.95)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Texto motivacional grande -->
  <text x="900" y="300" font-size="72" font-weight="bold" fill="rgba(255,255,255,0.25)" font-family="Arial, sans-serif" letter-spacing="3">
    ¡VUELA ALTO!
  </text>
  
  <text x="900" y="380" font-size="48" font-weight="bold" fill="rgba(255,200,0,0.3)" font-family="Arial, sans-serif">
    Sube a la Cima
  </text>
</svg>
